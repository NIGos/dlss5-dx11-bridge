# dlss5-bridge keep
# Settings. Re-read about once a second while the game runs, so most take
# effect without a restart. Delete this file to get it back with defaults.
#
# The first line is the version that wrote this file. A different version
# replaces the file with its own defaults the first time it runs, and says
# so in the log; the same version never touches it. Change that line to
# "# dlss5-bridge keep" to keep this file across versions.

# THE TWO THAT MATTER
#
# vk_mirror  1 hooks the Vulkan NGX entry points as well, which is what
#            lets a Vulkan game's own DLSS be mirrored. Harmless on a
#            DirectX game, which has none to hook. Read once at launch.
# synth      1 allows a SUBSTITUTE DLSS contract, built out of ReShade's
#            depth and the NVIDIA driver's optical flow, when the game
#            provides none of its own. Off by default, and it should stay
#            off unless you want it: the result is visibly worse than real
#            DLSS. Optical flow does not know what a glyph or a leaf is, so
#            text goes soft and dense foliage smears. Red Dead Redemption 2
#            looks like it is melting; Baldur's Gate 3 holds together but
#            its text does not. That is the technique, not a bug.
#
#            It covers both cases: a game with no DLSS at all, and a game
#            whose own DLSS you switch off in its menu.
# synth_after  with synth=1, and ONLY for a game that has no DLSS of its
#            own: seconds to wait before building the contract without
#            ever having seen the game ask. Do not set it in a game that
#            HAS DLSS -- arming before the game asks costs the mirror the
#            whole session when it then does. Setting it also turns synth
#            on, so a file that already had it keeps working.
vk_mirror=1
synth=0
synth_after=0

# WHICH SOURCE MAY HOLD THE SESSION
# auto lets the game's own DLSS win and falls back to the synthetic
# contract; mirror pins the game's own and is how the fallback is turned
# off; synth pins the synthetic one; off disables both.
source=auto

# THE DRIVER'S OPTICAL FLOW ENGINE, used by the synthetic contract only.
# ofa_grid 0 off -- a ReShade motion-vector shader is then required -- or
# 1, 2, 4 finest to cheapest. ofa_perf 5 SLOW, 10 MEDIUM, 20 FAST.
ofa_grid=2
ofa_perf=20
# Force the motion-vector direction instead of the provider's own
# convention. 0 leaves it alone; -1 or 1 forces it. For diagnosis.
mv_sign_x=0
mv_sign_y=0
# How the Vulkan transport puts its result into the back buffer: 0 copies
# where the image allows it and draws it otherwise, 1 copies only, 2 draws
# always.
vk_present=0
# How the substitute's Vulkan transport orders itself against the private
# D3D12 device: 0 parks the game's queue on a Vulkan event while a worker
# thread runs the optical flow and the evaluate, 1 waits the queue idle on
# the CPU instead, which is slower and is the fallback if 0 misbehaves, and
# 2 pipelines -- one frame's evaluate runs while the game renders the next,
# so the wait the queue reaches is on work that started a frame ago, at the
# price of showing the result one present later (about 17 ms at 60 fps) and
# one more Output texture. 0 is the default and has neither cost.
vk_sync=0

# THE REST. stage 0 switches the add-on off without removing the file.
# flags -1 copies the create flags the game declared; any other value
# forces one, except 107, which is treated as unset.
stage=3
mode=2
skip_game=1
flags=-1
subrects=1
reset_every=0
pixels=0
dred=1
skip_exe=1
unwrap=1
